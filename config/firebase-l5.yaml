esphome:
  name: firebase-l5

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Bangkok
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

http_request:
  timeout: 10s

sensor:
  - platform: template
    id: temp
    name: "Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 25.0 + random_float() * 10.0;

  - platform: template
    id: humi
    name: "Humi"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 50.0 + random_float() * 30.0;

  - platform: template
    id: light
    name: "Light"
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 100.0 + random_float() * 900.0;

interval:
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - wifi.connected
              - lambda: |-
                  return id(sntp_time).now().is_valid();
          then:
            - logger.log:
                format: "Send temp=%.1f humi=%.1f light=%.0f"
                args:
                  - id(temp).state
                  - id(humi).state
                  - id(light).state

            # =========================
            # 1. PUT -> latest
            # =========================
            - http_request.send:
                method: PUT
                url: !secret firebase_latest_url
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "Latest HTTP status = %d"
                        args:
                          - response->status_code
                on_error:
                  then:
                    - logger.log: "Latest upload failed"

            # =========================
            # 2. POST -> history
            # =========================
            - http_request.send:
                method: POST
                url: !secret firebase_history_url
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "History HTTP status = %d"
                        args:
                          - response->status_code
                on_error:
                  then:
                    - logger.log: "History upload failed"
          else:
            - logger.log: "Skip Firebase: WiFi or time not ready"
