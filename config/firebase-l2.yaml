esphome:
  name: firebase-l2

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  timeout: 10s

sensor:
  - platform: template
    id: temp
    name: "Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 25.0 + random_float() * 10.0;

  - platform: template
    id: humi
    name: "Humi"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 50.0 + random_float() * 30.0;

  - platform: template
    id: light
    name: "Light"
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 100.0 + random_float() * 900.0;

interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log:
                format: "Send temp=%.1f humi=%.1f light=%.0f"
                args:
                  - id(temp).state
                  - id(humi).state
                  - id(light).state
            - http_request.send:
                method: PUT
                url: !secret firebase_latest_url
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                on_response:
                  then:
                    - logger.log:
                        format: "Firebase HTTP status = %d"
                        args:
                          - response->status_code
                on_error:
                  then:
                    - logger.log: "Firebase connection failed"
          else:
            - logger.log: "Skip Firebase: WiFi not connected"
