esphome:
  name: firebase-l1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

http_request:
  timeout: 10s

interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.send:
                method: PUT
                url: !secret firebase_latest_url
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["temp"] = 25.5;
                  root["humi"] = 60.0;
                  root["light"] = 300.0;
                on_response:
                  then:
                    - logger.log:
                        format: "Firebase HTTP status = %d"
                        args:
                          - response->status_code
                on_error:
                  then:
                    - logger.log: "Firebase connection failed"
          else:
            - logger.log: "Skip Firebase: WiFi not connected"
